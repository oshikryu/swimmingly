<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#3B82F6"/>

  <!-- Dolphin body -->
  <path
    d="M6 18 C8 14, 12 12, 18 12 C22 12, 25 14, 27 16 C25 15, 23 15, 21 16 C19 17, 17 19, 14 19 C11 19, 8 18, 6 18 Z"
    fill="#E0F2FE"
  />

  <!-- Dolphin head/nose -->
  <path
    d="M27 16 C28 16.5, 29 17, 28 18 C27 18.5, 25 18, 24 17 C25 16.5, 26 16, 27 16 Z"
    fill="#E0F2FE"
  />

  <!-- Dorsal fin -->
  <path
    d="M15 12 C15 10, 16 8, 18 9 C17 10, 17 11, 17 12 Z"
    fill="#E0F2FE"
  />

  <!-- Tail fin -->
  <path
    d="M6 18 C4 17, 3 15, 4 14 C5 15, 6 16, 7 17 M6 18 C4 19, 3 21, 4 22 C5 21, 6 20, 7 19 Z"
    fill="#E0F2FE"
  />

  <!-- Eye -->
  <circle cx="23" cy="15" r="1" fill="#1E40AF"/>

  <!-- Water splash -->
  <path
    d="M10 22 C11 21, 12 22, 13 21 C14 22, 15 21, 16 22"
    stroke="#93C5FD"
    stroke-width="1"
    stroke-linecap="round"
    fill="none"
  />
