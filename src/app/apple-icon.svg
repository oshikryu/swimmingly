<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#3B82F6"/>

  <!-- Dolphin body - scaled up -->
  <path
    d="M30 105 C45 75, 65 60, 100 60 C125 60, 145 75, 155 95 C140 85, 125 85, 115 95 C100 110, 85 120, 70 120 C50 120, 35 110, 30 105 Z"
    fill="#E0F2FE"
  />

  <!-- Dolphin head/nose -->
  <path
    d="M155 95 C165 100, 170 108, 165 115 C155 118, 140 112, 135 105 C145 100, 150 95, 155 95 Z"
    fill="#E0F2FE"
  />

  <!-- Dorsal fin -->
  <path
    d="M80 60 C80 45, 90 30, 105 40 C95 50, 92 55, 90 60 Z"
    fill="#E0F2FE"
  />

  <!-- Tail fin -->
  <path
    d="M30 105 C18 95, 12 80, 20 70 C28 82, 32 92, 38 100 Z"
    fill="#E0F2FE"
  />
  <path
    d="M30 105 C18 115, 12 130, 20 140 C28 128, 32 118, 38 110 Z"
    fill="#E0F2FE"
  />

  <!-- Eye -->
  <circle cx="130" cy="88" r="6" fill="#1E40AF"/>

  <!-- Water splash -->
  <path
    d="M55 140 C65 130, 80 140, 90 130 C100 140, 115 130, 125 140"
    stroke="#93C5FD"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
